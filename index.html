<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a2f">
  <meta name="description" content="計画して、始めて、学びを確かめる。学習習慣を支援するオフライン対応Webアプリ。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>Study Buddy | 学びの伴走者</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="メインメニュー">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">✳</div>
        <div class="brand-copy"><strong>Study Buddy</strong><span>今日の一歩を、続く習慣に。</span></div>
      </div>
      <div class="nav-heading">MY WORKSPACE</div>
      <nav class="nav-list">
        <button data-tab="home" class="nav-link active"><span aria-hidden="true">▦</span> ホーム</button>
        <button data-tab="plan" class="nav-link"><span aria-hidden="true">☑</span> 学習計画</button>
        <button data-tab="focus" class="nav-link"><span aria-hidden="true">◷</span> 集中タイマー</button>
        <button data-tab="reflect" class="nav-link"><span aria-hidden="true">✎</span> 振り返り</button>
        <button data-tab="insight" class="nav-link"><span aria-hidden="true">◫</span> 学習記録・比較</button>
        <button data-tab="guide" class="nav-link"><span aria-hidden="true">✦</span> 勉強法のヒント</button>
        <button data-tab="settings" class="nav-link"><span aria-hidden="true">⚙</span> 設定・データ管理</button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot"></span>データはこの端末に保存<span class="muted">学校や外部には送信しません</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div><div class="breadcrumb">YOUR LEARNING SPACE</div><div class="topbar-label" id="header-title">今日のホーム</div></div>
        <div class="top-right"><span class="date-chip" id="today-label"></span><button class="avatar-button" data-tab="settings" title="設定を開く" aria-label="設定を開く">☺</button></div>
      </header>
      <main id="view" class="main-content" tabindex="-1"></main>
      <footer class="page-footer">Study Buddy · 自分に合う学び方を、記録から探そう。<span>学習支援用プロトタイプ / v1.0</span></footer>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
